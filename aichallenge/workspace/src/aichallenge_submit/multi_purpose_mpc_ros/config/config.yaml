common:
  save_config: false

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  csv_path: "env/preliminary/optimized_traj_mincurv.csv"
  resolution: 0.6
  smoothing_distance: 2
  max_width: 6.0
  circular: true
  use_path_constraints_topic: false
  use_border_cells_topic: false
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  length: 1.087
  # width: 1.45   # real machine width
  width: 1.35   # artificially squeezed to force strict tracking
  static_safety_margin: 0.9 # margin for static walls (decoupled from dynamic opponent margin)

mpc:
  use_csv_velocity: false
  use_dynamic_steer_gain: true
  N: 30
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]
  R: [100000.0, 100000.0]
  a_min: -11.505 # m/s^2
  a_max: 3.0 # m/s^2
  delta_max_deg: 32.0 # degrees
  steer_rate_max: 1.5 # rad/s
  control_rate: 40.0 # Hz
  steering_tire_angle_gain_var: 1.0
  # steering_tire_angle_gain_var: 1.0
  # accel_low_pass_gain: 0.1
  # steer_low_pass_gain: 0.3
  accel_low_pass_gain: 1.0
  steer_low_pass_gain: 1.0
  wp_id_offset: 2
  use_max_kappa_pred: true


  ## ---------- 究極 ------------- ##
  ## Lap1: 53s, Lap2: 47s

  v_max: 36.0   # km/h
  ay_max: 22.0 # m/s^2, maximum lateral acceleration in curves
  Q: [10000.0, 80000000.0, 2000000.0]
  QN: [1000000.0, 1000000.0, 10000.0]

  ## --- 高速 (gnss delay 0.3) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 高速 (gnss delay 0.4) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 1850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 中高速 --- ##
  ## Lap1: 59s, Lap2: 54s
  # v_max: 25.0
  # ay_max: 7.0
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --------- 中速 -------------- ##
  ## Lap1: 67s, Lap2: 64s

  # v_max: 20.0
  # ay_max: 6.5
  # Q: [3000000.0, 90000000.0, 100000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  # QN: [1000000.0, 1000.0, 10000.0]

  ## -------- 低速 -------------- ##
  ## Lap1: 86s

  # v_max: 15.0
  # ay_max: 5.5
  # Q: [5000000.0, 100000000.0, 200000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  # QN: [1000000.0, 1000.0, 10000.0]

v2x_obstacle_avoidance:
  vehicle_radius: 0.73           # [m] clearance radius around opponent kart
  v_max_safety: 30.0            # [m/s] max velocity for tracker (noise filter)
  position_jump_threshold: 5.0  # [m] max telemetry jump before velocity reset
  
  # --- Dynamic Squeezing ---
  # When tailing/overtaking, we temporarily squeeze the static wall margin to allow 
  # the MPC to find a path through tighter gaps around opponents.
  squeezed_static_margin: 0.8   # [m] margin to static walls during avoidance

  # --- Proximity Gate ---
  # Obstacle avoidance (heavy path-constraint computation) only fires when an
  # opponent kart is detected AHEAD of us within this along-raceline distance.
  # Hysteresis: activate at activation_distance_m, deactivate at deactivation_distance_m.
  # Set activation_distance_m: 0.0 to fully disable, or a large value to always activate.
  activation_distance_m: 25.0   # [m] turn ON avoidance when opponent closer than this
  deactivation_distance_m: 30.0 # [m] turn OFF avoidance when opponent farther than this (hysteresis)

  # --- Tailing & Overtaking Strategy ---
  tailing_distance_m: 12.0      # [m] distance to start matching opponent's speed

  # --- Strict Tailing (Safe Distance Keeping) ---
  # These parameters are used globally when inside a strict_no_overtake_zone.
  # The kart will NOT try to creep up and attack.
  strict_tailing_speed_gain: 0.2
  strict_tailing_min_delta: 0.5 
  strict_no_overtake_zones: [[290.0, 340.0]] # Real tailing zones (example)

  fast_opponent:                  # Work for top tier fast kart
    threshold_kmh: 20.0            # Opponent speeds above this use these settings
    tailing_speed_gain: 0.5       # [-] proportional gain for approach speed
    tailing_speed_min_delta: 2.0   # [m/s] minimum relative speed during tailing (catching up)
    tailing_speed_safe_delta: 0.2  # [m/s] safe delta when waiting closely for a gap
    tailing_lateral_offset: 0.7    # [m] lateral offset to explicitly slide to the chosen side while waiting
    launch_safe_width: 0.1         # [m] required corridor width to trigger launch
    min_overtaking_steer_gain: [[20.0, 1.6], [35.0, 1.6]] # [-] dynamic min steer gain based on current speed
    min_tailing_steer_gain: 1.0                    # [-] dynamic min steer gain applied ONLY during tailing (before launch)
    launch_n: 22                   # For sonner vel boost, Dictates the Launch Distance (small N = wait until very close to launch)
    overtake_N: 10                 # MPC prediction horizon (N) during active launch mode
    no_overtake_zones: [] # Block straights here to prevent overtaking fast opponents on straights!
    #[190.0,200.0]
    corridor_bias: [[50.0,70.0, "RIGHT"],[105.0,125.0, "LEFT"],[210.0, 225.0, "RIGHT"],[240.0, 270.0,"LEFT"]]

  slow_opponent:                   # Work for npc, slow karts
    tailing_distance_m: 25.0       # [m] distance to start tailing logic and lateral offset earlier
    tailing_speed_gain: 0.5        # 0.3
    tailing_speed_min_delta: 0.5
    tailing_speed_safe_delta: 0.2  # [m/s] 0.2. safe delta when waiting closely for a gap
    tailing_lateral_offset: 0.7    # [m] lateral offset to explicitly slide to the chosen side while waiting
    launch_safe_width: 0.1         # [m]. 0.35. required corridor width to trigger launch (increased to prevent clipping)
    min_overtaking_steer_gain: [[10.0, 1.2], [25.0, 1.0]] # Dynamic gain: Increased to steer sharper during low speed passes
    min_tailing_steer_gain: 1.0                    # [-] dynamic min steer gain applied ONLY during tailing (before launch)
    launch_n: 20                   # For sooner lane change, Dictates the Launch Distance (large N = launch earlier from further away)
    overtake_N: 20                 # MPC prediction horizon (N) massively increased to see further ahead and plan a wider avoidance curve
    no_overtake_zones: [] # Fewer zones, slow cars are safe to pass anywhere else
    #[150.0,160.0]
    corridor_bias: [[0.0,55.0, "RIGHT"],[55.0,70.0, "RIGHT"],[105.0,125.0, "LEFT"],[210.0, 225.0, "RIGHT"],[240.0, 270.0,"LEFT"]] # ,[270.0, 295.0,"RIGHT"]
    #
recovery:
  enable: true
  stuck_vel_threshold_kmh: 2.0   # [km/h] threshold to consider vehicle stuck
  stuck_time_sec: 0.5            # [s] seconds stuck before triggering recovery
  reverse_vel_kmh: -5.0          # [km/h] speed when reversing out
  reverse_time_sec: 2.0          # [s] duration to reverse
  recovery_steer_gain: 2.0       # fixed steer gain override during recovery
  post_recovery_steer_gain: 2.0  # fixed steer gain override AFTER recovery (during cooldown)
  cooldown_sec: 10.0              # [s] cooldown duration after recovery finishes
  cooldown_Q: [5000000.0, 5000000.0, 2000000.0]  # Moderate Q[0] to avoid diving to apex, relaxed Q[1] (2M) to allow angling away from wall
  cooldown_R: [100000.0, 0.0]               # R[1] down to allow large steering inputs
  cooldown_ey_threshold: 0.05     # [m] return to normal when lateral error is small enough
  disabled_waypoints: []         # disable recovery at race start (waypoints 45 to 50)

# =============================================================================
# Debug Visualization
# =============================================================================
# Toggle each feature independently. Change config.yaml and rebuild/restart.
# No feature is active by default to keep the control loop lean.
#
# How to enable/disable each:
#   prediction_colors    true  → prediction dots turn YELLOW during V2X overtaking,
#                                RED during recovery. false → always CYAN (default).
#   v2x_diagnostic_log   true  → prints [V2X DBG] to terminal every ~1s showing
#                                opponent positions, Frenet distances, gate state.
#   path_corridor        true  → publishes /mpc/path_corridor in RViz2:
#                                yellow slats + magenta left edge + cyan right edge
#                                showing the N-step drivable corridor the MPC uses.
#   dynamic_obstacles    true  → publishes /mpc/dynamic_obstacles in RViz2:
#                                orange cylinders at each V2X opponent blob position.
#   v2x_status_text      true  → publishes /mpc/v2x_status in RViz2:
#                                floating text above the kart showing gate state,
#                                nearest opponent id/distance, and active steer gain.
#
debug_visualization:
  prediction_colors:  true   # fix prediction dot colors (CYAN/YELLOW/RED by state)
  v2x_diagnostic_log: true   # terminal log: V2X opponent distances + gate state
  path_corridor:      true   # RViz2: drivable corridor bounds ahead of kart
  dynamic_obstacles:  true   # RViz2: V2X opponent obstacle blobs (orange cylinders)
  v2x_status_text:    true   # RViz2: floating text showing V2X gate state
