/**:
  ros__parameters:
    angular_velocity_offset_x: 0.0     # [rad/s]
    angular_velocity_offset_y: 0.0     # [rad/s]
    angular_velocity_offset_z: -0.000  # [rad/s]
    angular_velocity_stddev_xx: 0.03   # [rad/s]
    angular_velocity_stddev_yy: 0.03   # [rad/s]
